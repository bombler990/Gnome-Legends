<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gnome Legends</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        header {
            padding: 80px 20px;
        }

        h1 {
            font-size: 4em;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2em;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: gold;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
        }

        .button:hover {
            background: orange;
        }

        .team {
            margin-top: 50px;
            padding: 20px;
        }

        .member {
            background: rgba(255,255,255,0.1);
            margin: 15px auto;
            width: 90%;
            max-width: 500px;
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
        }

        /* Mobile-Friendly Styling */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5em;
            }

            p {
                font-size: 1em;
            }

            header {
                padding: 40px 10px;
            }

            h2 {
                font-size: 1.8em;
            }

            h3 {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Gnome Legends</h1>
    <p>An indie RPG adventure created by Yoan and friends.</p>

    <p>Gnome Legends Coming soon...</p>
</header>

<section class="team">
    <h2>The Team</h2>

    <div class="member">
        <h3>Yoan</h3>
        <p>Creator, game designer, and animator.</p>
    </div>

    <div class="member">
